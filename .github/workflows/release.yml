# Bump rules: commits since the last vX.Y.Z tag, highest bump wins.
#   type! or BREAKING CHANGE: body  -> major (minor while major is 0)
#   feat                            -> minor
#   fix/perf/docs/refactor/revert   -> patch
#   everything else                 -> no release
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Gate
        run: |
          go vet ./...
          go test ./...
          bash scripts/next-version_test.sh

      - name: Compute next version
        id: version
        run: |
          err="$(mktemp)"
          tag="$(bash scripts/next-version.sh 2>"$err")"
          reason="$(cat "$err")"
          if [ -z "$tag" ]; then
            echo "no release: $reason" >> "$GITHUB_STEP_SUMMARY"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag already exists; refusing to re-release" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "next release: $tag ($reason)" >> "$GITHUB_STEP_SUMMARY"

      - name: Build release binaries
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for spec in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${spec%/*}"
            GOARCH="${spec#*/}"
            name="flywheel-$TAG-$GOOS-$GOARCH"
            [ "$GOOS" = windows ] && name="$name.exe"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o "dist/$name" ./cmd/flywheel
            (cd dist && zip -q "$name.zip" "$name")
          done
          (cd dist && sha256sum *.zip > checksums.txt)

      - name: Publish release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/*.zip dist/checksums.txt --target "$GITHUB_SHA" --title "Flywheel $TAG" --generate-notes